<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In – FinTrack</title>
  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg">
  <!-- Global Stylesheet -->
  <link rel="stylesheet" href="css/style.css">
  <!-- Auth Stylesheet -->
  <link rel="stylesheet" href="css/auth.css">
</head>
<body class="auth-page">

  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-brand">
        <a href="index.html" class="brand-logo">
          <span class="brand-icon">F</span>
          <span>FinTrack</span>
        </a>
        <h1 class="auth-title">Welcome Back</h1>
        <p class="auth-subtitle">Sign in to manage your budget and track expenses</p>
      </div>

      <form id="login-form" novalidate>
        <!-- Email Field -->
        <div class="form-group">
          <label for="login-email" class="form-label">Email Address</label>
          <input
            type="email"
            id="login-email"
            class="form-control"
            placeholder="alex.johnson@example.com"
            value="alex.johnson@example.com"
            required
            autocomplete="email"
          >
          <div id="login-email-error" class="form-error"></div>
        </div>

        <!-- Password Field -->
        <div class="form-group">
          <div class="d-flex justify-between align-center mb-1">
            <label for="login-password" class="form-label" style="margin-bottom: 0;">Password</label>
            <span class="text-muted" style="font-size: 0.8rem;">(Demo: password123)</span>
          </div>
          <div class="password-wrapper">
            <input
              type="password"
              id="login-password"
              class="form-control"
              placeholder="Enter your password"
              value="password123"
              required
              autocomplete="current-password"
            >
            <button type="button" class="password-toggle-btn" data-target="login-password">Show</button>
          </div>
          <div id="login-password-error" class="form-error"></div>
        </div>

        <!-- Submit Button -->
        <button type="submit" class="btn btn-primary btn-block mb-2">Sign In to Account</button>
      </form>

      <div class="auth-footer-text">
        Don't have an account yet? <a href="register.html">Create an account</a>
      </div>
    </div>

    <div class="text-center">
      <a href="index.html" class="auth-home-link">
        ← Return to Landing Page
      </a>
    </div>
  </div>

  <!-- Scripts -->
  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
